<section>
<h2>Day 1: Personal data and the law</h2>
<ol>
<li><p>Dana's data map lists the student system, the fee system and the model provider. Wafi writes every prompt to its enquiry log. What does the map miss?</p><ul><li><b>A.</b> Nothing: the provider is the only other store</li><li><b>B.</b> The log, which holds the full prompt of every enquiry</li><li><b>C.</b> Only debug output, which the law does not cover</li><li><b>D.</b> The cache, but caches hold no personal data</li></ul></li>
<li><p>Dana says the enquiry log runs on Rawafid's legitimate interest in quality checks. The log keeps full prompts, health notes included. Is that basis available?</p><ul><li><b>A.</b> Yes: quality checking is a legitimate interest</li><li><b>B.</b> Yes: the enrolment contract covers all of Wafi</li><li><b>C.</b> No: every flow needs the guardian's consent</li><li><b>D.</b> No: legitimate interest excludes sensitive data</li></ul></li>
<li><p>Dana sends a contractor the student file with names and national IDs removed and student numbers replaced by HMAC codes. Rawafid keeps the key. Under the PDPL guidelines, what is the file?</p><ul><li><b>A.</b> Personal data, because it can be linked back</li><li><b>B.</b> Anonymous data, because no names remain</li><li><b>C.</b> Outside the law, because the codes are encrypted</li><li><b>D.</b> Personal data only while Rawafid holds it</li></ul></li>
<li><p>The export went on the shared drive on 2026-10-21. Dana found the public link and told the DPO on 2026-11-09. Harm to the children is expected. By when must SDAIA be notified?</p><ul><li><b>A.</b> By 2026-10-24, three days after the upload</li><li><b>B.</b> When the investigation is finished</li><li><b>C.</b> Within 72 hours of 2026-11-09, so by 2026-11-12</li><li><b>D.</b> Only if someone is shown to have misused the data</li></ul></li>
<li><p>A team maps its assistant's data: the student database, the fee database and the hosted model. The assistant writes each request body, prompt included, to an application log. What should the map add?</p><ul><li><b>A.</b> Nothing, logs are technical data</li><li><b>B.</b> The application log, as a store of personal data</li><li><b>C.</b> Only the hosted model's own logs</li><li><b>D.</b> A note that logs are exempt for debugging</li></ul></li>
<li><p>On a data flow diagram, the step "send prompt" goes to a model endpoint hosted outside the Kingdom. Which obligation must be written on that edge besides minimum content?</p><ul><li><b>A.</b> Notice at collection only</li><li><b>B.</b> The breach notification deadline</li><li><b>C.</b> The conditions for transfer outside the Kingdom</li><li><b>D.</b> The right to correction</li></ul></li>
<li><p>A guardian who signed the enrolment contract asks the school assistant how many days her son was absent. Which legal basis fits answering her?</p><ul><li><b>A.</b> The contract the guardian is a party to</li><li><b>B.</b> Consent, collected again for each question</li><li><b>C.</b> Legitimate interest, because the data is sensitive</li><li><b>D.</b> No basis is needed for a parent</li></ul></li>
<li><p>A quality log of enquiries keeps the children's health notes. The school wants to keep it on its legitimate interest. What must change first?</p><ul><li><b>A.</b> Nothing, quality checks are a legitimate interest</li><li><b>B.</b> The guardians must be told once a year</li><li><b>C.</b> The log must move to another server</li><li><b>D.</b> The health notes must leave the log</li></ul></li>
<li><p>A file of guardians' details was exposed on 3 March. The school learns of it on 20 March and expects harm to the guardians. Under the breach guide, by when must SDAIA be notified?</p><ul><li><b>A.</b> Within 72 hours of 3 March</li><li><b>B.</b> Within 72 hours of 20 March</li><li><b>C.</b> Within 30 days of 20 March</li><li><b>D.</b> Only once misuse is confirmed</li></ul></li>
<li><p>A guardian asks the school for a copy of all data it holds about her daughter. Without an extension, how long does the school have to act?</p><ul><li><b>A.</b> Seven days</li><li><b>B.</b> Ninety days</li><li><b>C.</b> Thirty days</li><li><b>D.</b> There is no limit</li></ul></li>
<li><p>Which retention rule for an assistant's enquiry log is complete?</p><ul><li><b>A.</b> Keep the log as long as it is useful</li><li><b>B.</b> Delete old rows when the disk is full</li><li><b>C.</b> Ninety days</li><li><b>D.</b> Ninety days from the enquiry date, then scheduled deletion of rows and backups</li></ul></li>
<li><p>To answer "what is left to pay for my son?", which fields does the prompt need?</p><ul><li><b>A.</b> The fee balance, the child's first name and the message</li><li><b>B.</b> The whole fee record and the guardian's national ID</li><li><b>C.</b> The student file, so the model has context</li><li><b>D.</b> The guardian's IBAN, in case of a refund</li></ul></li>
<li><p>Student numbers are replaced by HMAC codes and names are removed. The school keeps the key. Under the PDPL guideline, the result is:</p><ul><li><b>A.</b> Anonymous data outside the law</li><li><b>B.</b> Personal data, because it can be linked back</li><li><b>C.</b> Public data that can be published</li><li><b>D.</b> Encrypted data that needs no protection</li></ul></li>
<li><p>A pseudonymised file keeps campus, grade, gender and exact date of birth. The school's website lists sports-day winners with the same four details. What is the main risk?</p><ul><li><b>A.</b> None, the file has no names</li><li><b>B.</b> The website breaks copyright</li><li><b>C.</b> A join on the four details re-identifies most children</li><li><b>D.</b> The codes can be guessed without the key</li></ul></li>
<li><p>After generalising birth date to birth year and grade to a band, the smallest group of identical quasi-identifiers holds one child. What does this mean?</p><ul><li><b>A.</b> That child can still be singled out; suppress or generalise further</li><li><b>B.</b> The data is now anonymous</li><li><b>C.</b> Generalisation failed for every child</li><li><b>D.</b> The key must be rotated</li></ul></li>
<li><p>Why is a plain SHA-256 hash of the student number a weak pseudonym?</p><ul><li><b>A.</b> SHA-256 is no longer secure</li><li><b>B.</b> Hashes are too long to store</li><li><b>C.</b> It cannot be joined across files</li><li><b>D.</b> Anyone can hash every possible student number and look the codes up</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Classify, share and send</h2>
<ol>
<li><p>Wafi's log keeps every full prompt since the pilot began. Nasser can make one change this week. Which one reduces the exposure the most?</p><ul><li><b>A.</b> Encrypt the log file on disk</li><li><b>B.</b> Remove the names from old rows</li><li><b>C.</b> Send minimised prompts and delete rows past 90 days</li><li><b>D.</b> Add the log to the privacy notice</li></ul></li>
<li><p>Dana joins the published fee schedule with each family's balance to show who is behind on payments. What is the report's level?</p><ul><li><b>A.</b> Restricted, the higher of its two parts</li><li><b>B.</b> Somewhere between Public and Restricted</li><li><b>C.</b> Public, because the fees are published</li><li><b>D.</b> Unclassified until someone reviews it</li></ul></li>
<li><p>Dana pseudonymises attendance counts with a keyed hash and asks to send them to the free hosted model for a monthly summary. Under Rawafid's rule, where may they go?</p><ul><li><b>A.</b> To the hosted model, now that they are pseudonymised</li><li><b>B.</b> To the hosted model, because Rawafid keeps the key</li><li><b>C.</b> Nowhere: attendance data can never reach a model</li><li><b>D.</b> To a locally served model only</li></ul></li>
<li><p>The centre says the purpose is research, so every requested field should be shared. What does the Data Sharing Policy's legitimate-purpose principle add?</p><ul><li><b>A.</b> Nothing: research is always a legitimate purpose</li><li><b>B.</b> The data is used only for the stated purpose, and fields beyond it are not shared</li><li><b>C.</b> Only public entities may receive data</li><li><b>D.</b> Data must be stored on the requester's own servers</li></ul></li>
<li><p>Dana finds a public instruction dataset under CC-BY-NC-4.0 and wants to tune Wafi's replies with it. Rawafid is a fee-charging private school group. What does the licence allow?</p><ul><li><b>A.</b> Any use, since it is public on the hub</li><li><b>B.</b> Any use, with attribution</li><li><b>C.</b> No use in Rawafid's commercial service</li><li><b>D.</b> Use only after classifying it as Public</li></ul></li>
<li><p>A member of staff wants to paste a guardian's message, with the child's name and a medical detail, into a public chatbot to improve the wording of a reply. Which instrument decides whether that is allowed?</p><ul><li><b>A.</b> The Open Data Policy</li><li><b>B.</b> The Generative AI Guidelines</li><li><b>C.</b> The Data Sharing Policy</li><li><b>D.</b> No instrument; it is a matter of style</li></ul></li>
<li><p>The school wants to publish its fee schedule as a machine-readable file anyone may reuse. Which instrument governs the release itself?</p><ul><li><b>A.</b> The Data Classification Policy</li><li><b>B.</b> The Personal Data Protection Law</li><li><b>C.</b> The Open Data Policy</li><li><b>D.</b> The Generative AI Guidelines</li></ul></li>
<li><p>A fee-charging training company finds an instruction dataset under CC-BY-NC-4.0 and wants to tune its customer assistant on it. What does the licence allow?</p><ul><li><b>A.</b> Any use with attribution</li><li><b>B.</b> Any use, because the data is public on the hub</li><li><b>C.</b> Use after classifying the dataset as Public</li><li><b>D.</b> No use in the company's commercial service</li></ul></li>
<li><p>A research partner asks for attendance data and adds "we may pass it to other research partners when needed". Under the Data Sharing Policy, which condition answers that line?</p><ul><li><b>A.</b> No onward sharing, written into the signed agreement</li><li><b>B.</b> Encryption of the file before sending</li><li><b>C.</b> Publication of the results after the study</li><li><b>D.</b> A shorter retention period</li></ul></li>
<li><p>A report joins a published price list with each customer's outstanding balance. Which level does the report take?</p><ul><li><b>A.</b> Restricted, the higher of its parts</li><li><b>B.</b> Public, because the prices are published</li><li><b>C.</b> Somewhere between the two levels</li><li><b>D.</b> None until it is reviewed</li></ul></li>
<li><p>An attendance summary by campus, grade and gender has 12 of its 95 cells with fewer than five students. Before suppression, what level fits it?</p><ul><li><b>A.</b> Public, because it holds no names</li><li><b>B.</b> Secret, because it concerns children</li><li><b>C.</b> Restricted, because small cells describe single children</li><li><b>D.</b> Public once the column names are changed</li></ul></li>
<li><p>Under a rule that only Public data goes to hosted models and Restricted data without sensitive fields goes to a model served in-house, where may pseudonymised absence counts go?</p><ul><li><b>A.</b> To any hosted model</li><li><b>B.</b> Nowhere at all</li><li><b>C.</b> To a hosted model if the key stays in-house</li><li><b>D.</b> To the in-house model only</li></ul></li>
<li><p>A free hosted model router does not say where prompts are processed. How should a team treat it when deciding what it may receive?</p><ul><li><b>A.</b> As processing in the Kingdom until shown otherwise</li><li><b>B.</b> As a transfer outside the Kingdom</li><li><b>C.</b> As exempt, because the service is free</li><li><b>D.</b> As a matter for the provider alone</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Ethics and risk in practice</h2>
<ol>
<li><p>After Lab 1.2 Wafi's prompt carries a child's first name, three counts and the guardian's message. Under Rawafid's rule, where may that prompt go with real records?</p><ul><li><b>A.</b> To the free hosted model, since it is minimised</li><li><b>B.</b> To a model served inside Rawafid only</li><li><b>C.</b> Nowhere: it describes a child</li><li><b>D.</b> To any hosted model whose terms forbid training on it</li></ul></li>
<li><p>The fairness check fails with a gap of 42 points. Dana proposes raising the threshold to 45 so the release can go ahead. What is wrong with that?</p><ul><li><b>A.</b> Nothing, if the new threshold is written down</li><li><b>B.</b> Thresholds must always be five points</li><li><b>C.</b> The check only matters after release</li><li><b>D.</b> A threshold set after the results is fitted to pass</li></ul></li>
<li><p>Dana's pilot report said Wafi answered 100% of test enquiries correctly. Every test enquiry was in English. Which bias type from the national guide does the report show?</p><ul><li><b>A.</b> Automation bias</li><li><b>B.</b> Evaluation bias</li><li><b>C.</b> Measurement bias</li><li><b>D.</b> Language bias</li></ul></li>
<li><p>Nasser adds a harm: an export of the full log, with health notes of 434 children, is shared outside Rawafid. He rates it unlikely (2) and catastrophic (4). What is its level and band?</p><ul><li><b>A.</b> 6, medium</li><li><b>B.</b> Catastrophic, because the impact is catastrophic</li><li><b>C.</b> 8, high</li><li><b>D.</b> 4, medium</li></ul></li>
<li><p>Layla must choose one line for the foot of every Wafi reply. Which one meets the Generative AI Guidelines' transparency items?</p><ul><li><b>A.</b> "Sent by Wafi, Rawafid's digital service."</li><li><b>B.</b> "This reply may contain errors."</li><li><b>C.</b> "Drafted with AI. Write 'staff' to reach a person."</li><li><b>D.</b> "See our privacy policy for details."</li></ul></li>
<li><p>Under the national framework's scales, a harm is rated likely (3) and high impact (3). What is its level and band?</p><ul><li><b>A.</b> 6, medium</li><li><b>B.</b> 9, high</li><li><b>C.</b> 3, medium</li><li><b>D.</b> 12, high</li></ul></li>
<li><p>A harm is rated unlikely (2) with a catastrophic impact (4). Which band does the framework give it?</p><ul><li><b>A.</b> Catastrophic, because the impact is catastrophic</li><li><b>B.</b> Medium</li><li><b>C.</b> High</li><li><b>D.</b> Low</li></ul></li>
<li><p>An assistant drafts replies to parents; enquiries about health and custody go to staff before any reply. The team proposes sending those replies straight away and reviewing them later. How does the ethics risk tier change?</p><ul><li><b>A.</b> It does not change; the same model is used</li><li><b>B.</b> It falls, because replies are faster</li><li><b>C.</b> It becomes unacceptable at once</li><li><b>D.</b> It rises towards high risk, with conformity assessments</li></ul></li>
<li><p>After treatment, a harm is still rated high. What does the framework expect next?</p><ul><li><b>A.</b> Further treatment, or acceptance by someone with the authority, with a reason, and escalation</li><li><b>B.</b> Deleting the harm from the register</li><li><b>C.</b> Lowering the impact rating until it is medium</li><li><b>D.</b> Waiting for the next annual review</li></ul></li>
<li><p>Why must a fairness threshold be set before the test is run?</p><ul><li><b>A.</b> Because the principles require a fixed value of ten points</li><li><b>B.</b> Because tests cannot be rerun</li><li><b>C.</b> So it cannot be fitted to the results</li><li><b>D.</b> So the developer can choose it freely</li></ul></li>
<li><p>To test whether an assistant serves Arabic and English writers equally, which test set is best?</p><ul><li><b>A.</b> Each question written in both languages, by the same guardian</li><li><b>B.</b> Forty English questions and a translation of the replies</li><li><b>C.</b> The questions guardians sent last month, in whatever language</li><li><b>D.</b> Arabic questions in Modern Standard Arabic only</li></ul></li>
<li><p>A pilot reports 100% correct replies. All test questions were in English, but half the users write in Arabic. Which bias type does the report show?</p><ul><li><b>A.</b> Automation bias</li><li><b>B.</b> Measurement bias</li><li><b>C.</b> Evaluation bias</li><li><b>D.</b> Exclusion bias</li></ul></li>
<li><p>Which line at the foot of each reply meets the Generative AI Guidelines' transparency items?</p><ul><li><b>A.</b> "Sent by our digital service."</li><li><b>B.</b> "This reply may contain errors."</li><li><b>C.</b> "See our privacy policy."</li><li><b>D.</b> "Drafted with AI. Write 'staff' to reach a person."</li></ul></li>
<li><p>A routing rule sends sensitive enquiries to staff. Why is the Arabic word for "fees" a poor keyword for it?</p><ul><li><b>A.</b> It is too long to match</li><li><b>B.</b> It appears in routine fee questions, so every balance question would go to staff</li><li><b>C.</b> Arabic words cannot be matched</li><li><b>D.</b> Fee questions are never sensitive</li></ul></li>
</ol>

ull,"explanation":"Minimisation cuts what each row holds, and the retention rule cuts how many rows exist: 78% of the log was past a 90-day rule.","misconceptions":["Treats a stronger lock as a substitute for keeping less: what is kept can still leak","Thinks removing names alone makes records anonymous; Lab 1.3 re-identified 96%","","Believes telling people about a practice makes it lawful"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which change does the most for Wafi's log?"},"level":null,"pool":"checkpoint"},{"id":"check-classify-combined-q1","type":"single","prompt":"Dana joins the published fee schedule with each family's balance to show who is behind on payments. What is the report's level?","options":[{"key":"A","text":"Restricted, the higher of its two parts"},{"key":"B","text":"Somewhere between Public and Restricted"},{"key":"C","text":"Public, because the fees are published"},{"key":"D","text":"Unclassified until someone reviews it"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Combined data takes the highest level of its parts, and each family's balance is a Restricted individual transaction.","misconceptions":["","Averages levels instead of taking the highest","Lets the public part decide the level of the whole","Thinks a new combination needs no classification until someone asks"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-classify-combined","title":"What level does Dana's new report take?"},"level":null,"pool":"checkpoint"},{"id":"check-pseudonymised-hosted-q1","type":"single","prompt":"Dana pseudonymises attendance counts with a keyed hash and asks to send them to the free hosted model for a monthly summary. Under Rawafid's rule, where may they go?","options":[{"key":"A","text":"To the hosted model, now that they are pseudonymised"},{"key":"B","text":"To the hosted model, because Rawafid keeps the key"},{"key":"C","text":"Nowhere: attendance data can never reach a model"},{"key":"D","text":"To a locally served model only"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Pseudonymised data is still personal data and keeps its Restricted level; counts without notes carry no health data, so a local model is permitted.","misconceptions":["Thinks pseudonymised data is anonymous and so Public","Believes a key held by Rawafid moves the data's location","Over-applies the sensitive-data branch to counts without notes",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-pseudonymised-hosted","title":"Does pseudonymising open the hosted route?"},"level":null,"pool":"checkpoint"},{"id":"check-research-purpose-q1","type":"single","prompt":"The centre says the purpose is research, so every requested field should be shared. What does the Data Sharing Policy's legitimate-purpose principle add?","options":[{"key":"A","text":"Nothing: research is always a legitimate purpose"},{"key":"B","text":"The data is used only for the stated purpose, and fields beyond it are not shared"},{"key":"C","text":"Only public entities may receive data"},{"key":"D","text":"Data must be stored on the requester's own servers"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A legitimate purpose rests on a legal basis or an operational need, and limits use to that purpose; the PDPL limits content to what the purpose needs.","misconceptions":["Treats the word research as a basis for any data","","Confuses a legitimate purpose with the requester's status","Believes a purpose principle concerns storage"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-research-purpose","title":"Is \"for research\" enough?"},"level":null,"pool":"checkpoint"},{"id":"check-licence-q1","type":"single","prompt":"Dana finds a public instruction dataset under CC-BY-NC-4.0 and wants to tune Wafi's replies with it. Rawafid is a fee-charging private school group. What does the licence allow?","options":[{"key":"A","text":"Any use, since it is public on the hub"},{"key":"B","text":"Any use, with attribution"},{"key":"C","text":"No use in Rawafid's commercial service"},{"key":"D","text":"Use only after classifying it as Public"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"NC means non-commercial: a fee-charging service is commercial use, whatever the attribution.","misconceptions":["Equates publicly downloadable with free for any use","Thinks attribution alone satisfies a non-commercial licence","","Confuses a licence condition with a classification level"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-licence","title":"Can Rawafid tune Wafi on the dataset?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"After Lab 1.2 Wafi's prompt carries a child's first name, three counts and the guardian's message. Under Rawafid's rule, where may that prompt go with real records?","options":[{"key":"A","text":"To the free hosted model, since it is minimised"},{"key":"B","text":"To a model served inside Rawafid only"},{"key":"C","text":"Nowhere: it describes a child"},{"key":"D","text":"To any hosted model whose terms forbid training on it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Every field of the minimised prompt is still Restricted personal data, and Restricted data goes to a locally served model only.","misconceptions":["Thinks a short prompt is a Public one","","Treats counts as health data, which they are not","Believes a provider's terms decide the classification"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Where may Wafi's minimised prompt go?"},"level":null,"pool":"checkpoint"},{"id":"check-threshold-q1","type":"single","prompt":"The fairness check fails with a gap of 42 points. Dana proposes raising the threshold to 45 so the release can go ahead. What is wrong with that?","options":[{"key":"A","text":"Nothing, if the new threshold is written down"},{"key":"B","text":"Thresholds must always be five points"},{"key":"C","text":"The check only matters after release"},{"key":"D","text":"A threshold set after the results is fitted to pass"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The threshold defines fair before the run; moving it after a failure hides the gap instead of treating it.","misconceptions":["Thinks the problem is the size of the number, not when it was set","Confuses a fairness threshold with a statistical significance test","Believes fairness checks only apply in production",""],"lo":["LO6"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-threshold","title":"Dana wants to change the threshold"},"level":null,"pool":"checkpoint"},{"id":"check-bias-type-q1","type":"single","prompt":"Dana's pilot report said Wafi answered 100% of test enquiries correctly. Every test enquiry was in English. Which bias type from the national guide does the report show?","options":[{"key":"A","text":"Automation bias"},{"key":"B","text":"Evaluation bias"},{"key":"C","text":"Measurement bias"},{"key":"D","text":"Language bias"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The test set did not reflect the guardians who use Wafi, so the score overstated how well it serves them.","misconceptions":["Confuses a test-set problem with people over-trusting outputs","","Thinks the expected answers themselves were wrong","Names a bias of the model's behaviour, not of the report"],"lo":["LO6"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-bias-type","title":"Which bias type does the pilot's test show?"},"level":null,"pool":"checkpoint"},{"id":"check-rating-q1","type":"single","prompt":"Nasser adds a harm: an export of the full log, with health notes of 434 children, is shared outside Rawafid. He rates it unlikely (2) and catastrophic (4). What is its level and band?","options":[{"key":"A","text":"6, medium"},{"key":"B","text":"Catastrophic, because the impact is catastrophic"},{"key":"C","text":"8, high"},{"key":"D","text":"4, medium"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The level is likelihood times impact, 2 × 4 = 8, and 8 to 12 is the high band.","misconceptions":["Adds the two ratings instead of multiplying them","Lets the impact rating alone decide the band","","Takes the higher rating as the level"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-rating","title":"Rate the new harm"},"level":null,"pool":"checkpoint"},{"id":"check-notice-q1","type":"single","prompt":"Layla must choose one line for the foot of every Wafi reply. Which one meets the Generative AI Guidelines' transparency items?","options":[{"key":"A","text":"\"Sent by Wafi, Rawafid's digital service.\""},{"key":"B","text":"\"This reply may contain errors.\""},{"key":"C","text":"\"Drafted with AI. Write 'staff' to reach a person.\""},{"key":"D","text":"\"See our privacy policy for details.\""}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"It says the reply was made with AI and gives a channel that does not go through the AI.","misconceptions":["Thinks a brand name tells people they are dealing with AI","Believes a disclaimer replaces a route to a person","","Puts transparency in a document people must look for"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-notice","title":"Which notice meets the guidelines?"},"level":null,"pool":"checkpoint"},{"id":"pdpl-log-is-a-store","type":"single","prompt":"A team maps its assistant's data: the student database, the fee database and the hosted model. The assistant writes each request body, prompt included, to an application log. What should the map add?","options":[{"key":"A","text":"Nothing, logs are technical data"},{"key":"B","text":"The application log, as a store of personal data"},{"key":"C","text":"Only the hosted model's own logs"},{"key":"D","text":"A note data subject (here through the guardian) is a party to does not need separate consent.","misconceptions":["","Believes consent is the only basis","Reverses the rule: legitimate interest is never available for sensitive data","Thinks a family relationship replaces a legal basis"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"pdpl-legit-interest-health","type":"single","prompt":"A quality log of enquiries keeps the children's health notes. The school wants to keep it on its legitimate interest. What must change first?","options":[{"key":"A","text":"Nothing, quality checks are a legitimate interest"},{"key":"B","text":"The guardians must be told once a year"},{"key":"C","text":"The log must move to another server"},{"key":"D","text":"The health notes must leave the log"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Legitimate interest is available only when no sensitive data is processed; health data is sensitive.","misconceptions":["Thinks any business reason is enough whatever the data","Replaces a condition on the data with a notice","Treats location of storage as the legal question",""],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"pdpl-72-hours","type":"single","prompt":"A file of guardians' details was exposed on 3 March. The school learns of it on 20 March and expects harm to the guardians. Under the breach guide, by when must SDAIA be notified?","options":[{"key":"A","text":"Within 72 hours of 3 March"},{"key":"B","text":"Within 72 hours of 20 March"},{"key":"C","text":"Within 30 days of 20 March"},{"key":"D","text":"Only once misuse is confirmed"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The 72 hours run from the moment the controller becomes aware, when harm to the data or the data subjects is expected.","misconceptions":["Starts the clock at the breach instead of at awareness","","Uses the period for answering a dent file, so the model has context"},{"key":"D","text":"The guardian's IBAN, in case of a refund"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The purpose needs the balance and a name to greet; every other field fails the actual-need test.","misconceptions":["","Keeps identifiers in case they help","Believes more context always improves the answer","Collects for a possible future need, which the guideline rules out"],"lo":["LO4"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"pseudo-still-personal","type":"single","prompt":"Student numbers are replaced by HMAC codes and names are removed. The school keeps the key. Under the PDPL guideline, the result is:","options":[{"key":"A","text":"Anonymous data outside the law"},{"key":"B","text":"Personal data, because it can be linked back"},{"key":"C","text":"Public data that can be published"},{"key":"D","text":"Encrypted data that needs no protection"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Pseudonymised data stays personal data because additional information can link it to the person.","misconceptions":["Equates removing names with anonymisation","","Jumps from a privacy measure to a classification level","Treats a cryptographic step as an exemption"],"lo":["LO4"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"reid-linkage","type":"single","prompt":"A pseudonymised file keeps campus, grade, gender and exact date of birth. The school's website lists sports-day winners with the same four details. What is the main risk?","options":[{"key":"A","text":"None, the file has no names"},{"key":"B","text":"The website breaks copyright"},{"key":"C","text":"A join on the four details re-identifies most children"},{"key":"D","text":"The codes can be guessed without the key"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Quasi-identifiers together are close to unique per child, so joining with a public list puts names back on the records.","misconceptions":["Thinks names are the only identifiers","Looks at the wrong legal question","","Blames the codes when the leak is in the other columns"],"lo":["LO4"],"day":1,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"reid-k-anonymity","type":"single","prompt":"After generalising birth date to birth year and grade to a band, the smallest group of identical quasi-identifiers holds one child. What does this mean?","options":[{"key":"A","text":"That child can still be singled out; suppress or generalise further"},{"key":"B","text":"The data is now anonymous"},{"key":"C","text":"Generalisation failed for every child"},{"key":"D","text":"The key must be rotated"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"k = 1 means at least one record is unique on the quasi-identifiers, so it is still exposed even if the average risk fell.","misconceptions":["","Reads a lower average as no risk","Confuses one exposed child with a complete failure","Fixes the codes when the problem is the other columns"],"lo":["LO4"],"day":1,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"plain-hash","type":"single","prompt":"Why is a plain SHA-256 hash of the student number a weak pseudonym?","options":[{"key":"A","text":"SHA-256 is no longer secure"},{"key":"B","text":"Hashes are too long to store"},{"key":"C","text":"It cannot be joined across files"},{"key":"D","text":"Anyone can hash every possible student number and look the codes up"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The space of student numbers is small, so an unkeyed hash is reversed by trying them all; a keyed hash prevents that.","misconceptions":["Blames the algorithm rather than the missing key","Treats storage size as the privacy problem","Gets it backwards: hashes join well, which is the danger",""],"lo":["LO4"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"inst-genai-paste","type":"single","prompt":"A member of staff wants to paste a guardian's message, with the child's name and a medical detail, into a public chatbot to improve the wording of a reply. Which instrument decides whether that is allowed?","options":[{"key":"A","text":"The Open Data Policy"},{"key":"B","text":"The Generative AI Guidelines"},{"key":"C","text":"The Data Sharing Policy"},{"key":"D","text":"No instrument; it is a matter of style"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The Generative AI Guidelines say what may be entered into generative AI tools: nothing classified Restricted or higher.","misconceptions":["Thinks open data rules cover any data that leaves the organisation","","Treats a person typing into a tool as sharing between entities","Believes drafting help is outside the rules because no system is built"],"lo":["LO2"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"inst-open-data","type":"single","prompt":"The school wants to publish its fee schedule as a machine-readable file anyone may reuse. Which instrument governs the release itself?","options":[{"key":"A","text":"The Data Classification Policy"},{"key":"B","text":"The Personal Data Protection Law"},{"key":"C","text":"The Open Data Policy"},{"key":"D","text":"The Generative AI Guidelines"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The Open Data Policy governs how Public data is released for reuse: open by default, machine-readable, free and licensed.","misconceptions":["Stops at the level and misses the release rules","Applies a personal data law to a set with no personal data","","Names an instrument about generative AI tools"],"lo":["LO2"],"day":2,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"licence-nc","type":"single","prompt":"A fee-charging training company finds an instruction dataset under CC-BY-NC-4.0 and wants to tune its customer assistant on it. What does the licence allow?","options":[{"key":"A","text":"Any use with attribution"},{"key":"B","text":"Any use, because the data is public on the hub"},{"key":"C","text":"Use after classifying the dataset as Public"},{"key":"D","text":"No use in the company's commercial service"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"NC means non-commercial: a fee-charging service is commercial use whatever the attribution.","misconceptions":["Thinks attribution satisfies every Creative Commons licence","Equates downloadable with free for any use","Confuses a licence condition with a classification level",""],"lo":["LO2"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"sharing-onward","type":"single","prompt":"A research partner asks for attendance data and adds \"we may pass it to other research partners when needed\". Under the Data Sharing Policy, which condition answers that line?","options":[{"key":"A","text":"No onward sharing, written into the signed agreement"},{"key":"B","text":"Encryption of the file before sending"},{"key":"C","text":"Publication of the results after the study"},{"key":"D","text":"A shorter retention period"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Onward sharing changes the purpose and the accountable parties; the agreement must forbid it or name each recipient.","misconceptions":["","Fixes a security weakness instead of a purpose problem","Confuses the data with the study's findings","Treats a destination problem as a duration problem"],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"class-combined","type":"single","prompt":"A report joins a published price list with each customer's outstanding balance. Which level does the report take?","options":[{"key":"A","text":"Restricted, the higher of its parts"},{"key":"B","text":"Public, because the prices are published"},{"key":"C","text":"Somewhere between the two levels"},{"key":"D","text":"None until it is reviewed"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Combined data takes the highest level of its parts, and individual balances are Restricted.","misconceptions":["","Lets the public part set the level","Averages levels instead of taking the highest","Forgets that unclassified data is treated as Restricted"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"class-small-cells","type":"single","prompt":"An attendance summary by campus, grade and gender has 12 of its 95 cells with fewer than five students. Before suppression, what level fits it?","options":[{"key":"A","text":"Public, because it holds no names"},{"key":"B","text":"Secret, because it concerns children"},{"key":"C","text":"Restricted, because small cells describe single children"},{"key":"D","text":"Public once the column names are changed"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A cell of one or two students is those students' attendance; until small cells are suppressed or merged, the table holds personal data.","misconceptions":["Thinks removing names removes the personal data","Over-classifies: Secret is for serious national or entity-level impact","","Treats a cosmetic change as protection"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"dest-pseudo","type":"single","prompt":"Under a rule that only Public data goes to hosted models and Restricted data without sensitive fields goes to a model served in-house, where may pseudonymised absence counts go?","options":[{"key":"A","text":"To any hosted model"},{"key":"B","text":"Nowhere at all"},{"key":"C","text":"To a hosted model if the key stays in-house"},{"key":"D","text":"To the in-house model only"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Pseudonymised data is still personal data and keeps its Restricted level; counts without notes are not sensitive.","misconceptions":["Thinks pseudonymised means Public","Applies the sensitive-data branch to counts with no health content","Believes holding the key moves the data's level",""],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"dest-unknown-location","type":"single","prompt":"A free hosted model router does not say where prompts are processed. How should a team treat it when deciding what it may receive?","options":[{"key":"A","text":"As processing in the Kingdom until shown otherwise"},{"key":"B","text":"As a transfer outside the Kingdom"},{"key":"C","text":"As exempt, because the service is free"},{"key":"D","text":"As a matter for the provider alone"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"If the location cannot be shown, the conditions for transfer cannot be shown to be met, so it is treated as abroad.","misconceptions":["Puts the burden of proof the wrong way round","","Thinks price changes the legal position","Shifts the controller's duty to the processor"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"risk-level-product","type":"single","prompt":"Under the national framework's scales, a harm is rated likely (3) and high impact (3). What is its level and band?","options":[{"key":"A","text":"6, medium"},{"key":"B","text":"9, high"},{"key":"C","text":"3, medium"},{"key":"D","text":"12, high"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The level is likelihood times impact, 3 × 3 = 9, which falls in the 8 to 12 high band.","misconceptions":["Adds the ratings instead of multiplying","","Takes one rating as the level","Uses the wrong impact rating"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"risk-catastrophic-band","type":"single","prompt":"A harm is rated unlikely (2) with a catastrophic impact (4). Which band does the framework give it?","options":[{"key":"A","text":"Catastrophic, because the impact is catastrophic"},{"key":"B","text":"Medium"},{"key":"C","text":"High"},{"key":"D","text":"Low"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"2 × 4 = 8, the high band; only 16 is catastrophic.","misconceptions":["Lets the impact alone decide the band","Misreads the band edges","","Lets the low likelihood dominate"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"risk-tier-change","type":"single","prompt":"An assistant drafts replies to parents; enquiries about health and custody go to staff before any reply. The team proposes sending those replies straight away and reviewing them later. How does the ethics risk tier change?","options":[{"key":"A","text":"It does not change; the same model is used"},{"key":"B","text":"It falls, because replies are faster"},{"key":"C","text":"It becomes unacceptable at once"},{"key":"D","text":"It rises towards high risk, with conformity assessments"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Removing human review on sensitive matters affecting children raises the risk to basic rights, which the principles treat as high risk.","misconceptions":["Thinks the tier depends on the model, not the use","Confuses speed with lower risk","Jumps to a level reserved for prohibited uses",""],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"risk-residual-accept","type":"single","prompt":"After treatment, a harm is still rated high. What does the framework expect next?","options":[{"key":"A","text":"Further treatment, or acceptance by someone with the authority, with a reason, and escalation"},{"key":"B","text":"Deleting the harm from the register"},{"key":"C","text":"Lowering the impact rating until it is medium"},{"key":"D","text":"Waiting for the next annual review"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Residual risk is re-assessed; a risk outside the appetite is treated further or accepted at the right level and escalated.","misconceptions":["","Treats a register as a list of open tasks to close","Adjusts the rating to fit the wish","Leaves a known high risk unmanaged"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"eth-threshold-first","type":"single","prompt":"Why must a fairness threshold be set before the test is run?","options":[{"key":"A","text":"Because the principles require a fixed value of ten points"},{"key":"B","text":"Because tests cannot be rerun"},{"key":"C","text":"So it cannot be fitted to the results"},{"key":"D","text":"So the developer can choose it freely"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A threshold defines fair before the run; one chosen after the results can be set to pass whatever happened.","misconceptions":["Invents a fixed number the principles do not set","Confuses timing with repeatability","","Thinks the builder should set the bar for their own work"],"lo":["LO6"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"eth-paired","type":"single","prompt":"To test whether an assistant serves Arabic and English writers equally, which test set is best?","options":[{"key":"A","text":"Each question written in both languages, by the same guardian"},{"key":"B","text":"Forty English questions and a translation of the replies"},{"key":"C","text":"The questions guardians sent last month, in whatever language"},{"key":"D","text":"Arabic questions in Modern Standard Arabic only"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Pairing makes the language the only difference; the Arabic side should include the varieties guardians write in.","misconceptions":["","Tests the translation, not the assistant","Mixes question difficulty with language","Leaves out the dialects real users write in"],"lo":["LO6"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"eth-evaluation-bias","type":"single","prompt":"A pilot reports 100% correct replies. All test questions were in English, but half the users write in Arabic. Which bias type does the report show?","options":[{"key":"A","text":"Automation bias"},{"key":"B","text":"Measurement bias"},{"key":"C","text":"Evaluation bias"},{"key":"D","text":"Exclusion bias"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The test set did not reflect the real users, so the score overstated how well the assistant serves them.","misconceptions":["Confuses a test-set flaw with over-trust in outputs","Thinks the expected answers were wrong","","Names a bias about leaving data out of training"],"lo":["LO6"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"eth-notice-line","type":"single","prompt":"Which line at the foot of each reply meets the Generative AI Guidelines' transparency items?","options":[{"key":"A","text":"\"Sent by our digital service.\""},{"key":"B","text":"\"This reply may contain errors.\""},{"key":"C","text":"\"See our privacy policy.\""},{"key":"D","text":"\"Drafted with AI. Write 'staff' to reach a person.\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"It says the reply was produced with AI and offers a channel that does not go through the AI.","misconceptions":["Thinks a brand name discloses AI use","Replaces a route to a person with a disclaimer","Hides the information where people must look for it",""],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"eth-routing-keyword","type":"single","prompt":"A routing rule sends sensitive enquiries to staff. Why is the Arabic word for \"fees\" a poor keyword for it?","options":[{"key":"A","text":"It is too long to match"},{"key":"B","text":"It appears in routine fee questions, so every balance question would go to staff"},{"key":"C","text":"Arabic words cannot be matched"},{"key":"D","text":"Fee questions are never sensitive"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A keyword that routine questions use raises false alarms; the rule must separate a disputed fee from a question about one.","misconceptions":["Treats length as the matching problem","","Believes matching only works in English","Forgets that fee disputes are sensitive"],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"analyze","pool":"practice"}]}</script>
